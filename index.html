<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1> Shena Develos </h1>
    <header>
        <nav>
            <span class="logo">Shena</span>
            <ul>
                <li>
                    <a href="about">About</a>
                </li>
                <li>
                    <a href="services">Services</a>
                </li>
                <li>
                    <a href="#contact">Contact</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="about">
            <h2>About me </h2>
            <p class="about-me">i want to </p>

        </section>

        <section id="services">

            <h2>Services</h2>
            <p class="my-services">mama mo blue</p>
        </section>

        <section id="contact">

            <h2> Contact me</h2>
            <form action="#">
                <!-- Name -->
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required><br>


                <!--Email-->
                <label for="email">Email </label>
                <input type="text" id="email" name="email" required><br><br>

                <!--Message-->
                <label for="message">Message</label>
                <textarea type="text" id="message" name="message" row="5" required></textarea><br><br>
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
